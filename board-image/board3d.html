<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tock PRESTIGE - Plateau 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e6ecfb 55%, #cdd8f3 100%);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #loader {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e6ecfb 55%, #cdd8f3 100%);
      transition: opacity .6s ease, visibility .6s;
    }
    #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader .dots { display: flex; gap: 10px; }
    #loader .dots i {
      width: 16px; height: 16px; border-radius: 5px; background: #f7f8fc;
      border: 3px solid var(--c); box-shadow: 0 0 10px var(--c), 0 4px 8px rgba(80, 100, 160, .25);
      animation: hop 1s ease-in-out infinite; animation-delay: var(--d);
    }
    #loader span { color: #7f8db3; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
    #light {
      position: fixed; top: 14px; right: 14px; z-index: 5; cursor: pointer;
      display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 12px;
      font: inherit; font-size: 13px; letter-spacing: .06em; color: #4d5a80;
      background: rgba(255, 255, 255, .75); border: 1px solid rgba(120, 140, 200, .35);
      border-radius: 999px; backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(80, 100, 160, .15);
    }
    #light:hover { background: #fff; }
    #light i {
      width: 10px; height: 10px; border-radius: 50%; background: #2f6bff;
      box-shadow: 0 0 8px 2px #2f6bff; transition: background .3s, box-shadow .3s;
    }
    #light.off i { background: #b5bdd3; box-shadow: none; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 12px; text-align: center;
      color: #7f8db3; font-size: 13px; letter-spacing: .04em; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader">
    <div class="dots">
      <i style="--c:#e8344a;--d:0s"></i><i style="--c:#2f6bff;--d:.12s"></i>
      <i style="--c:#18b56a;--d:.24s"></i><i style="--c:#ffb81c;--d:.36s"></i>
    </div>
    <span>Tock Prestige</span>
  </div>
  <button id="light" type="button" aria-pressed="true"><i></i>Light</button>
  <div id="hint">glisser pour tourner · molette pour zoomer · double-clic pour recentrer</div>
  <script type="module" src="board3d.js"></script>
</body>
</html>
